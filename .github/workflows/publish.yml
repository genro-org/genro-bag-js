name: Publish

# A version tag publishes to npm (@genrojs/bag, trusted publishing) and JSR
# (@genro/bag, OIDC). Each job skips a version already on its registry, so the
# workflow can run again on the same tag (Actions → Publish → Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  npm:
    # Trusted publisher on npmjs.com: genro-org/genro-bag-js, publish.yml, environment release.
    runs-on: ubuntu-latest
    needs: test
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or later for trusted publishing
        run: npm install -g npm@latest
      - name: Publish @genrojs/bag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@genrojs/bag@$VERSION" version >/dev/null 2>&1; then
            echo "@genrojs/bag@$VERSION is already on npm"
          else
            npm publish --access public
          fi

  jsr:
    # The JSR package @genro/bag is linked to genro-org/genro-bag-js.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the npm dependencies the JSR publisher resolves
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Publish @genro/bag
        run: |
          VERSION=$(node -p "require('./jsr.json').version")
          if curl -fsS https://jsr.io/@genro/bag/meta.json | node -e "process.exit(JSON.parse(require('fs').readFileSync(0)).versions['$VERSION'] ? 0 : 1)"; then
            echo "@genro/bag@$VERSION is already on JSR"
          else
            npx jsr publish
          fi
